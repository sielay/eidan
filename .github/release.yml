# Categorises the auto-generated section of GitHub release notes
# (`gh release create --generate-notes`). PRs are grouped by label; the
# release headline itself comes from the release commit body (see
# .github/workflows/release-on-bump.yml).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ✨ Features
      labels: [feature, enhancement, feat]
    - title: 🔌 Plugins
      labels: [plugin, plugins]
    - title: 🐛 Fixes
      labels: [bug, fix, bugfix]
    - title: 📚 Docs
      labels: [docs, documentation]
    - title: 🛠 Deploy & CI
      labels: [deploy, ci, infra, build]
    - title: ⬆️ Dependencies
      labels: [dependencies, deps]
    - title: Other changes
      labels: ["*"]

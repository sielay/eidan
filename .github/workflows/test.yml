# Unit tests — node:test specs (packages/*/src/*.test.ts) run through matbot's TypeScript loader
# (external/matbot/apps/cli/register.js), which strips types and resolves the .js-extension import
# convention to the .ts sources. Most specs import only local code + node: built-ins (type-only
# cross-package imports are erased), but some (e.g. ical/imap) import runtime dependencies
# (node-ical, imapflow, mailparser), so the workspace is installed before the run.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: node --import ./external/matbot/apps/cli/register.js --test "packages/*/src/*.test.ts"

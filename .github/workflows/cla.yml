name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    # Run on PRs and on the trigger comment "I have read the CLA Document and I hereby sign the CLA".
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # Signatures land on the cla-signatures branch in *this* repo, so
          # the default GITHUB_TOKEN (contents: write, granted above) is
          # enough. A PERSONAL_ACCESS_TOKEN is only needed when signatures
          # live in a separate repo / organisation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Path to the CLA file in this repo, surfaced in the bot's PR
          # comment so signatories see the canonical text.
          path-to-document: 'https://github.com/sielay/eidan/blob/main/CLA.md'
          # Where signatures land. Edit the branch name if you prefer.
          branch: 'cla-signatures'
          path-to-signatures: 'signatures/version1/cla.json'
          # GitHub usernames exempt from the CLA check. These are the
          # maintainer / org accounts whose contributions already belong to
          # Sielay Ltd. Expand as the org grows.
          allowlist: 'sielay,bot*,dependabot[bot],noreply@anthropic.com'
          # Comment the bot posts on a PR that needs a signature.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          # Re-trigger phrase, used by maintainers if the bot needs to recheck.
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          custom-notsigned-prcomment: 'Thanks for the PR. Before it can be merged, please read [the CLA](https://github.com/sielay/eidan/blob/main/CLA.md) and post a comment containing the sentence below.'
          # Lock the CLA version. Bump if the CLA text materially changes —
          # contributors will be re-prompted to sign the new version.
          lock-pullrequest-aftermerge: false

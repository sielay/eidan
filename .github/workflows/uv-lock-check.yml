name: uv-lock-check

permissions:
  contents: read

# Guard against pyproject.toml ↔ uv.lock drift. PR #30 added
# aiosmtplib to apps/backend/pyproject.toml without refreshing the
# workspace uv.lock; the drift only surfaced at `fly deploy` time
# because the Dockerfile uses `uv sync --frozen`. This gate runs
# `uv lock --check` so the same kind of drift fails on the PR
# instead of in production.
#
# No ``paths:`` filter on pull_request. If this workflow is added
# to required status checks for branch protection, a path-skipped
# run stays "pending" forever and blocks the PR from merging —
# python-tests.yml takes the same posture for the same reason
# (see its top-of-file note). ``uv lock --check`` is cheap, so the
# always-on cost is negligible.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/pyproject.toml"
      - "uv.lock"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.15"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: uv lock --check

name: Release images

# Build + push the multi-arch (amd64 + arm64) engine and web images to GHCR on a release tag, so
# `docker compose up` (and the deploy CLI's compose-ssh target) can pull published images instead of
# building locally. Pi-friendly by virtue of the arm64 platform.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Image version tag (e.g. v0.1.0). Set by the release-on-bump caller; empty on a tag push."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one image failing must not cancel the other (they're independent artifacts)
      matrix:
        include:
          - name: engine
            context: .
            dockerfile: infra/fly-mb/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the engine image needs external/matbot

      # The web image's build context is apps/web, but registry.generated.ts imports the per-bundle
      # frontend mirrors under apps/web/src/plugins/<name>/ which are gitignored (assemble vendors them
      # at deploy time, from packages/). Replay that web-vendoring on the runner — which HAS packages/ —
      # so the mirrors are present in the build context. Without this, `next build` fails with
      # "Module not found: '@/plugins/imap/Accounts'" (and the release ships a broken web image).
      - uses: actions/setup-node@v4
        if: matrix.name == 'web'
        with:
          node-version: "24"
      - name: Vendor plugin frontends into apps/web
        if: matrix.name == 'web'
        run: node scripts/vendor-web-frontends.mjs

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/eidan-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

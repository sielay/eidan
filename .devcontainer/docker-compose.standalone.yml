# Standalone dev container compose stack — Postgres sidecar, no
# Supabase coupling.
#
# Use this when:
#   - you can't or don't want to run Supabase on the host (offline,
#     Pi, low-RAM box),
#   - you're targeting a non-Supabase auth provider (see ROADMAP.md
#     "Auth: pluggable JWT/OAuth providers"), or
#   - you point at hosted Supabase for auth and want eidan.* to stay
#     on a local DB that doesn't round-trip to a cloud project.
#
# How to use it:
#   cp .devcontainer/docker-compose.standalone.yml \
#      .devcontainer/docker-compose.yml
#   # then reopen in container.
#
# eidan.* tables will live in this sidecar; they will NOT be visible
# in Supabase Studio. Inspect them with `psql "$DATABASE_URL"` instead.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # See docker-compose.yml — parent mount lets plugin symlinks
      # into sibling bundle repos resolve inside the container.
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      # In-container DATABASE_URL — points at the `db` sidecar.
     # DATABASE_URL: postgresql+asyncpg://eidan:eidan@db:5432/eidan
    # If you still want Supabase auth (hosted, or local CLI on host),
    # this lets the container reach it. Safe to leave even when auth
    # is bypassed.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eidan
      POSTGRES_PASSWORD: eidan
      POSTGRES_DB: eidan
    volumes:
      - eidan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidan -d eidan"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  eidan-db-data:

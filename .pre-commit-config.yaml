# Local pre-commit hooks. Install once per clone with:
#
#     pip install pre-commit && pre-commit install
#
# CI runs the same checks (see .github/workflows/uv-lock-check.yml);
# this config is the fast local feedback path so drift fails on `git
# commit` instead of waiting for the PR.

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv.lock in sync with pyproject.toml
        entry: uv lock --check
        language: python
        additional_dependencies:
          - uv==0.11.15
        files: ^([^/]*pyproject\.toml|.*/pyproject\.toml|uv\.lock)$
        pass_filenames: false

[project]
name = "eidan-schemas"
version = "0.1.0"
description = "JSON Schema source of truth + Pydantic v2 codegen. Sibling to the @eidan/schemas TS surface."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
codegen = [
    "datamodel-code-generator>=0.25.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidan_schemas"]

[project]
name = "eidan-backend"
version = "0.1.0"
description = "Eidan backend — agentic loop, providers, persistence"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "apscheduler>=3.10.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "PyYAML>=6.0",
    "aiosmtplib>=3.0",
    "eidan-schemas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-postgresql>=6.0,<7.0",
    "psycopg[binary]>=3.1",
    "ruff>=0.5",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
eidan-backend-http = "eidan_backend.http.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidan_backend"]

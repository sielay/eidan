<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="eidan">
  <!-- Full-bleed background so platform masks (circle / squircle / rounded-rect)
       never reveal a transparent corner. The glyph stays inside the inner ~60%
       safe zone so it is never clipped. -->

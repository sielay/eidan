[project]
name = "eidan-cli"
version = "0.1.0"
description = "Eidan CLI — `eidan` (user mode: login/repl) and `eidan admin` (operator mode: migrations, plugins)"
requires-python = ">=3.11"
dependencies = [
    "eidan-backend",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "PyYAML>=6.0",
    # Round-trip YAML editing (comments + formatting preserved) for
    # `eidan plugin enable/disable` topology mutations. PyYAML strips
    # comments on dump, ruamel.yaml round-trips them.
    "ruamel.yaml>=0.18",
    "tzlocal>=5.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
eidan = "eidan_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidan_cli"]

# Eidan deployment topology. Edit this file with your nodes, then:
#
#   ansible-vault encrypt --vault-id default@.vault-pass topology.yml
#   git init && git add . && git commit -m "initial topology"
#   eidan deploy --topology topology.yml
#
# The schema is documented at:
#   packages/schemas/schemas/core/deploy/Topology.schema.json
# in the upstream eidan repo. Every field has an inline description
# there; this file is the minimum viable starter.

schema: 1

# Repo-wide defaults applied per-node via deep-merge. Per-node
# settings override these. Put values that are the same across nodes
# here (e.g. plugin source org, default provider) so the per-node
# entries stay short.
defaults:
  plugin_source: gh:sielay
  # GitHub PAT with `repo:read` on the private bundle repos. Vault-
  # encrypt this value (`!vault |`) before committing.
  github_token: REPLACE-ME-WITH-GITHUB-PAT
  provider:
    name: anthropic
    default_model: claude-sonnet-4-6
  # Pin the eidan release image once here so every Fly machine rolls
  # forward together. Override per node when you want one machine to
  # lag behind for testing. Bump the tag (or a digest) to roll out a
  # new release. Skipped for `target: pi` (Ansible installs from git).
  # image: ghcr.io/sielay/eidan:v0.1.0

# One entry per host you run eidan on. Node names are operator-chosen
# and used by `eidan deploy --node <name>` and the per-node telemetry
# view in the admin UI.
nodes:
  # ---- Example: a Raspberry Pi at home ----
  # Uncomment and edit. Delete the entries you don't need.
  #
  # kasha:
  #   target: pi
  #   host: 192.168.1.100
  #   ssh_user: pi
  #   ssh_key: ~/.ssh/id_ed25519
  #   database_url: postgresql+asyncpg://eidan:eidan@127.0.0.1:5432/eidan
  #   auth_master_key: REPLACE-ME-WITH-A-48-BYTE-TOKEN-FROM-secrets.token_urlsafe
  #   auth_allowed_email: you@example.com
  #   provider:
  #     name: ollama
  #     default_model: phi3
  #   bundles: [eidan-pro]
  #   node_id: pi-kasha
  #   node_type: pi

  # ---- Example: a Fly.io machine ----
  #
  # fly-prod:
  #   target: fly
  #   app: eidan-api
  #   region: lhr
  #   # Override the defaults pin if this machine should track a
  #   # different release. Otherwise inherits defaults.image.
  #   # image: ghcr.io/sielay/eidan:v0.1.0
  #   database_url: postgresql+asyncpg://...
  #   auth_master_key: REPLACE-ME-WITH-A-48-BYTE-TOKEN-FROM-secrets.token_urlsafe
  #   auth_allowed_email: you@example.com
  #   bundles: [eidan-pro]
  #   disable: [sentry]   # silences the 5-min tick on auto-stop machines

  # ---- Placeholder so the file parses out of the box ----
  # Replace with one of the examples above (or your own).
  placeholder:
    target: pi
    host: 127.0.0.1
    ssh_user: REPLACE-ME
    database_url: postgresql+asyncpg://REPLACE-ME
    auth_master_key: REPLACE-ME-WITH-A-48-BYTE-TOKEN-FROM-secrets.token_urlsafe
    auth_allowed_email: you@example.com

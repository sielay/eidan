# Ansible playbook for a self-hosted eidan backend on a Raspberry Pi
# (or any always-on Debian/Ubuntu host you can ssh into as a sudoer).
#
# This file is shipped as a generic, tracked artefact — copy nothing,
# edit nothing here. Per-deploy values (host IP, DB URL, master key,
# bundle list, …) live in your gitignored `.eidan/` directory:
#
#   cp infra/pi/inventory.ini.example     .eidan/inventory.ini
#   cp infra/pi/group_vars/all.yml.example .eidan/vars.yml
#   $EDITOR .eidan/inventory.ini .eidan/vars.yml
#
# Day-to-day from your laptop:
#
#   # Reconcile env file + plugin set, restart if anything changed:
#   ansible-playbook -i .eidan/inventory.ini -e @.eidan/vars.yml \
#     infra/pi/playbook.yml
#
#   # Just push an env tweak and restart:
#   ansible-playbook ... infra/pi/playbook.yml --tags env,restart
#
#   # Just add/refresh paid bundles:
#   ansible-playbook ... infra/pi/playbook.yml --tags plugins
#
# Scope today: STEADY-STATE only — render `/etc/eidan/eidan.env`,
# install bundles listed in `eidan_bundles`, restart on change. The
# one-time bootstrap (system user, uv, Ollama, Postgres, systemd unit
# install, first migration) still follows docs/DEPLOY_PI_BOOTSTRAP.md
# by hand. A `bootstrap` tag is left in as a stub for when we
# automate that half too.
#
# Secrets: `.eidan/vars.yml` carries DATABASE_URL, the auth master
# key, and your GitHub PAT. Treat the file accordingly — `chmod 0600`
# at minimum, and encrypt with `ansible-vault encrypt .eidan/vars.yml`
# once you're past the dev-loop phase. `ansible-playbook` reads
# vaulted files transparently when you pass `--ask-vault-pass` or
# `--vault-password-file`.

- name: Reconcile eidan backend on a Pi
  hosts: eidan_pi
  become: true
  gather_facts: false

  vars:
    # All overridable from .eidan/vars.yml. Defaults match the recipe in docs/DEPLOY_PI_BOOTSTRAP.md.
    eidan_install_dir: /opt/eidan
    eidan_etc_dir: /etc/eidan
    eidan_env_file: /etc/eidan/eidan.env
    eidan_plugins_dir: /var/lib/eidan/plugins
    eidan_service_name: eidan-backend
    eidan_uv_bin: /home/eidan/.local/bin/uv
    eidan_user: eidan
    eidan_source_repo: https://github.com/sielay/eidan.git
    eidan_source_ref: main

  handlers:
    - name: restart eidan-backend
      ansible.builtin.systemd:
        name: "{{ eidan_service_name }}"
        state: restarted
        daemon_reload: true

  tasks:

    # --- bootstrap (stub) ---------------------------------------------
    # Placeholder for the system-level bits still done by hand: apt
    # packages (git/curl), the `eidan` service user, uv installation,
    # Ollama install, Postgres setup. Each needs root + may need
    # extra ansible collections (community.postgresql etc.); they're
    # a separate PR. The `source` block below covers the clone +
    # sync + migrate half that the user-mode reconcile actually
    # needs once those prerequisites are in place.
    - name: Bootstrap (apt / user / uv / Ollama) not yet automated
      ansible.builtin.fail:
        msg: >-
          System bootstrap (apt packages, eidan user, uv, Ollama,
          Postgres) is not yet automated. Follow
          docs/DEPLOY_PI_BOOTSTRAP.md §1–§4 by hand, then re-run
          without `--tags bootstrap` (the `source` block on the
          default run handles clone + sync + migrate).
      tags: [bootstrap, never]

    # --- env file -----------------------------------------------------
    # Runs first so the migration task in `source` below can read
    # DATABASE_URL + EIDAN_AUTH_MASTER_KEY from the env file.
    - name: Ensure /etc/eidan exists
      ansible.builtin.file:
        path: "{{ eidan_etc_dir }}"
        state: directory
        owner: root
        group: "{{ eidan_user }}"
        mode: "0750"
      tags: [env]

    - name: Render /etc/eidan/eidan.env
      ansible.builtin.template:
        src: templates/eidan.env.j2
        dest: "{{ eidan_env_file }}"
        owner: root
        group: "{{ eidan_user }}"
        mode: "0640"
      notify: restart eidan-backend
      tags: [env]

    - name: Render /etc/systemd/system/{{ eidan_service_name }}.service
      ansible.builtin.template:
        src: templates/eidan-backend.service.j2
        dest: "/etc/systemd/system/{{ eidan_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: restart eidan-backend
      tags: [env]

    # --- source: clone + sync /opt/eidan + run migrations -----------
    # Idempotent. Runs on every deploy by default. Operator can
    # exclude with `--skip-tags source` if they want to avoid the
    # extra git fetch on every run; the cost is small though (a
    # single fetch hits no objects when up-to-date).
    #
    # What's NOT automated yet (genuinely pre-conditions for this
    # block): apt-installed `git`, the `eidan` system user, `uv`
    # under `~eidan/.local/bin/`, and Ollama / Postgres. Those still
    # follow docs/DEPLOY_PI_BOOTSTRAP.md §1–§4 by hand.
    - name: Ensure /opt/eidan parent directory exists
      ansible.builtin.file:
        path: "{{ eidan_install_dir }}"
        state: directory
        owner: "{{ eidan_user }}"
        group: "{{ eidan_user }}"
        mode: "0755"
      tags: [source]

    - name: Clone or fetch the eidan source tree
      become_user: "{{ eidan_user }}"
      ansible.builtin.git:
        repo: "{{ eidan_source_repo }}"
        dest: "{{ eidan_install_dir }}"
        version: "{{ eidan_source_ref }}"
        # `force: false` means the playbook won't blow away local
        # uncommitted changes inside /opt/eidan — if the operator
        # has been hand-editing the source there, we surface a
        # genuine merge conflict instead of silently overwriting.
        force: false
      register: eidan_source_clone
      notify: restart eidan-backend
      tags: [source]

    - name: Sync the eidan venv (uv sync --no-dev)
      become_user: "{{ eidan_user }}"
      ansible.builtin.command:
        cmd: "{{ eidan_uv_bin }} --directory {{ eidan_install_dir }} sync --no-dev"
      # Only re-sync when the git checkout actually changed. uv sync
      # is idempotent but reading the lockfile and computing the
      # dependency graph isn't free; skipping the no-op saves ~1s
      # per deploy on the Pi.
      when: eidan_source_clone.changed
      notify: restart eidan-backend
      tags: [source]

    - name: Run database migrations
      become_user: "{{ eidan_user }}"
      ansible.builtin.shell:
        cmd: |
          set -a
          . {{ eidan_env_file }}
          set +a
          {{ eidan_uv_bin }} --directory {{ eidan_install_dir }} run eidan admin db migrate
      # The env file has to exist before migrations can run (DATABASE_URL,
      # EIDAN_AUTH_MASTER_KEY are read from there). The env-tag tasks
      # above have already rendered it. Alembic is version-tracked so
      # a re-run on an already-migrated DB is a no-op.
      changed_when: false   # Alembic doesn't report changes back; treat as always-ok.
      tags: [source]

    # --- plugins ------------------------------------------------------
    - name: Ensure plugin override directory exists
      ansible.builtin.file:
        path: "{{ eidan_plugins_dir }}"
        state: directory
        owner: "{{ eidan_user }}"
        group: "{{ eidan_user }}"
        mode: "0755"
      tags: [plugins]

    - name: Read current plugin lock (may not exist yet)
      ansible.builtin.slurp:
        src: "{{ eidan_plugins_dir }}/.lock"
      register: plugin_lock_raw
      failed_when: false
      changed_when: false
      tags: [plugins]

    - name: Decode plugin lock contents
      ansible.builtin.set_fact:
        plugin_lock_content: >-
          {{ (plugin_lock_raw.content | b64decode)
             if (plugin_lock_raw.content is defined)
             else '' }}
      tags: [plugins]

    - name: Install paid bundles
      # Idempotent on the bundle name: skip if any plugin row in
      # /var/lib/eidan/plugins/.lock already carries `bundle: <name>`.
      # For version bumps and removals, hand-edit the lock then run
      # `eidan admin plugin sync --prune` (see docs/DEPLOY_PI_BOOTSTRAP.md);
      # we don't try to model that as ansible state yet.
      ansible.builtin.command:
        cmd: >-
          {{ eidan_uv_bin }} --directory {{ eidan_install_dir }}
          run eidan admin plugin install {{ item }}
      loop: "{{ eidan_bundles | default([]) }}"
      when: "('bundle: ' + item) not in plugin_lock_content"
      become_user: "{{ eidan_user }}"
      environment:
        EIDAN_PLUGINS_DIR: "{{ eidan_plugins_dir }}"
        DATABASE_URL: "{{ eidan_database_url }}"
        EIDAN_PLUGIN_SOURCE: "{{ eidan_plugin_source }}"
        EIDAN_GITHUB_TOKEN: "{{ eidan_github_token }}"
      notify: restart eidan-backend
      # NOTE on the GitHub PAT: it lives in the `environment:` block
      # above (not in `cmd:` or `loop:`), so ansible's default output
      # does NOT print it. `-vvv` verbosity WILL dump the env dict —
      # don't run the deploy with `-vvv` if anyone might see the
      # output. (Earlier versions of this task had `no_log: true` as
      # belt-and-braces, but that censored the actual install error
      # too, leaving operators blind when a bundle failed to install.)
      tags: [plugins]

    # --- restart ------------------------------------------------------
    # Explicit restart tag for when you want to bounce the service
    # without changing anything else (e.g. after editing the lock
    # file by hand). The handlers above already restart on env /
    # plugin changes, so this is the "force restart" knob.
    - name: Force restart eidan-backend
      ansible.builtin.systemd:
        name: "{{ eidan_service_name }}"
        state: restarted
        daemon_reload: true
      tags: [restart, never]

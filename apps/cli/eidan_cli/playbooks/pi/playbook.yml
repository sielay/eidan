# Ansible playbook for a self-hosted eidan backend on a Raspberry Pi
# (or any always-on Debian/Ubuntu host you can ssh into as a sudoer).
#
# Invoked by `eidan deploy --node <name>` from the operator's laptop.
# Slice C of #104 (bake-at-build for Pi): the operator-local eidan
# checkout PLUS resolved bundle plugin dirs are pre-assembled into
# `<runtime>/build-context/` by the CLI, and this playbook rsyncs
# that tree onto the Pi. The Pi never needs git, never clones from
# GitHub, never sees a PAT.
#
# Day-to-day from your laptop:
#
#   eidan deploy --node <name>                  # full reconcile
#   eidan deploy --node <name> --tags env,restart  # env tweak only
#   eidan deploy --node <name> --tags source    # re-sync code only
#
# Scope today: STEADY-STATE only — render `/etc/eidan/eidan.env`,
# rsync the assembled tree, run migrations, restart on change. The
# one-time bootstrap (system user, uv, Ollama, Postgres) still
# follows docs/DEPLOY_PI_BOOTSTRAP.md by hand. A `bootstrap` tag is
# left in as a stub for when we automate that half too.
#
# Secrets: `.eidan/vars.yml` carries DATABASE_URL and the auth
# master key. Treat the file accordingly — `chmod 0600` at minimum,
# encrypt with `ansible-vault encrypt .eidan/vars.yml` once you're
# past the dev-loop phase. `ansible-playbook` reads vaulted files
# transparently when you pass `--ask-vault-pass` or
# `--vault-password-file`. No GitHub PAT lives in here anymore
# (slice C of #104 — bundle plugins arrive via the laptop, not via
# remote clone).

- name: Reconcile eidan backend on a Pi
  hosts: eidan_pi
  become: true
  gather_facts: false

  vars:
    # All overridable from .eidan/vars.yml. Defaults match the recipe in docs/DEPLOY_PI_BOOTSTRAP.md.
    eidan_install_dir: /opt/eidan
    eidan_etc_dir: /etc/eidan
    eidan_env_file: /etc/eidan/eidan.env
    eidan_service_name: eidan-backend
    eidan_uv_bin: /home/eidan/.local/bin/uv
    eidan_user: eidan
    # eidan_local_tree is rendered by the CLI's pi.py reconciler:
    # it points at <runtime>/build-context/, the pre-assembled tree
    # of eidan core + bundle plugins ready to rsync.

  handlers:
    - name: restart eidan-backend
      ansible.builtin.systemd:
        name: "{{ eidan_service_name }}"
        state: restarted
        daemon_reload: true

  tasks:

    # --- bootstrap (stub) ---------------------------------------------
    # Placeholder for the system-level bits still done by hand: apt
    # packages (git/curl), the `eidan` service user, uv installation,
    # Ollama install, Postgres setup. Each needs root + may need
    # extra ansible collections (community.postgresql etc.); they're
    # a separate PR. The `source` block below covers the clone +
    # sync + migrate half that the user-mode reconcile actually
    # needs once those prerequisites are in place.
    - name: Bootstrap (apt / user / uv / Ollama) not yet automated
      ansible.builtin.fail:
        msg: >-
          System bootstrap (apt packages, eidan user, uv, Ollama,
          Postgres) is not yet automated. Follow
          docs/DEPLOY_PI_BOOTSTRAP.md §1–§4 by hand, then re-run
          without `--tags bootstrap` (the `source` block on the
          default run handles clone + sync + migrate).
      tags: [bootstrap, never]

    # --- env file -----------------------------------------------------
    # Runs first so the migration task in `source` below can read
    # DATABASE_URL + EIDAN_AUTH_MASTER_KEY from the env file.
    - name: Ensure /etc/eidan exists
      ansible.builtin.file:
        path: "{{ eidan_etc_dir }}"
        state: directory
        owner: root
        group: "{{ eidan_user }}"
        mode: "0750"
      tags: [env]

    - name: Render /etc/eidan/eidan.env
      ansible.builtin.template:
        src: templates/eidan.env.j2
        dest: "{{ eidan_env_file }}"
        owner: root
        group: "{{ eidan_user }}"
        mode: "0640"
      notify: restart eidan-backend
      tags: [env]

    - name: Render /etc/systemd/system/{{ eidan_service_name }}.service
      ansible.builtin.template:
        src: templates/eidan-backend.service.j2
        dest: "/etc/systemd/system/{{ eidan_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: restart eidan-backend
      tags: [env]

    # --- source: rsync laptop tree → /opt/eidan, sync venv, migrate
    # The CLI assembles a build context on the laptop containing
    # eidan core + the bundle plugins resolved from operator-local
    # repos (see eidan_cli.build_context). This block rsyncs that
    # tree onto the Pi. No git clone happens Pi-side; no PAT lives
    # on the Pi.
    #
    # What's NOT automated yet (genuinely pre-conditions for this
    # block): apt-installed `rsync`, the `eidan` system user, `uv`
    # under `~eidan/.local/bin/`, and Ollama / Postgres. Those still
    # follow docs/DEPLOY_PI_BOOTSTRAP.md §1–§4 by hand.
    - name: Ensure /opt/eidan parent directory exists
      ansible.builtin.file:
        path: "{{ eidan_install_dir }}"
        state: directory
        owner: "{{ eidan_user }}"
        group: "{{ eidan_user }}"
        mode: "0755"
      tags: [source]

    - name: rsync local eidan tree to /opt/eidan
      # ``ansible.posix.synchronize`` runs rsync from the laptop
      # (control node) over SSH to the Pi. ``rsync_path: "sudo
      # rsync"`` lets it write under /opt/eidan even though the SSH
      # user (operator's account) doesn't own that directory. We
      # exclude ``.venv`` so the Pi-side venv (built by `uv sync`
      # below) survives across deploys — re-creating it every time
      # would burn 30-60s per deploy.
      ansible.posix.synchronize:
        src: "{{ eidan_local_tree }}"
        dest: "{{ eidan_install_dir }}/"
        delete: true
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--exclude=.venv"
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
      register: eidan_source_sync
      notify: restart eidan-backend
      tags: [source]

    - name: Chown /opt/eidan to the eidan user
      # `sudo rsync` writes as root; restore ownership so the eidan
      # user can run `uv sync` and the systemd service can read.
      ansible.builtin.file:
        path: "{{ eidan_install_dir }}"
        owner: "{{ eidan_user }}"
        group: "{{ eidan_user }}"
        recurse: true
      when: eidan_source_sync.changed
      tags: [source]

    - name: Sync the eidan venv (uv sync --no-dev)
      become_user: "{{ eidan_user }}"
      ansible.builtin.command:
        cmd: "{{ eidan_uv_bin }} --directory {{ eidan_install_dir }} sync --no-dev"
      # Only re-sync when the source tree actually changed. uv sync
      # is idempotent but reading the lockfile and computing the
      # dependency graph isn't free; skipping the no-op saves ~1s
      # per deploy on the Pi.
      when: eidan_source_sync.changed
      notify: restart eidan-backend
      tags: [source]

    - name: Run database migrations
      become_user: "{{ eidan_user }}"
      ansible.builtin.shell:
        cmd: |
          set -a
          . {{ eidan_env_file }}
          set +a
          {{ eidan_uv_bin }} --directory {{ eidan_install_dir }} run eidan admin db migrate
      # The env file has to exist before migrations can run (DATABASE_URL,
      # EIDAN_AUTH_MASTER_KEY are read from there). The env-tag tasks
      # above have already rendered it. Alembic is version-tracked so
      # a re-run on an already-migrated DB is a no-op.
      changed_when: false   # Alembic doesn't report changes back; treat as always-ok.
      tags: [source]

    # The previous `plugins` block (install paid bundles via `eidan
    # admin plugin install`) is gone in slice C of #104. Bundle
    # plugins arrive baked into the laptop's build context, get
    # rsynced into /opt/eidan/plugins/ alongside core plugins, and
    # are loaded directly from there. No remote install step, no PAT
    # on the Pi.

    # --- restart ------------------------------------------------------
    # Explicit restart tag for when you want to bounce the service
    # without changing anything else (e.g. after editing the lock
    # file by hand). The handlers above already restart on env /
    # plugin changes, so this is the "force restart" knob.
    - name: Force restart eidan-backend
      ansible.builtin.systemd:
        name: "{{ eidan_service_name }}"
        state: restarted
        daemon_reload: true
      tags: [restart, never]

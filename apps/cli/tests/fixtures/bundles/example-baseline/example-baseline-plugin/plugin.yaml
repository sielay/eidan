schema: 1

name: example-baseline-plugin
version: 0.1.0
display_name: Example Baseline Plugin
description: >
  Stand-in for a paid-baseline plugin in the CLI install tests. The
  example-bundle fixture's bundle.yaml lists this bundle as a
  dependency to exercise the auto-install recursion.

tier: core
license: AGPL

bundle:
  name: example-baseline
  kind: baseline

host:
  eidan: ">=0.1.0"
  python: ">=3.11"

backend:
  entrypoint: example_baseline_plugin.plugin:Plugin

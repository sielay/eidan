schema: 1

name: sentry
version: 0.1.0
display_name: Sentry
description: >
  Continuous-thinking loop (`docs/SENTRY_FEATURE_SPEC.md`). Runs every
  5 minutes (configurable via `EIDAN_SENTRY_TICK_INTERVAL`), inspects
  the operator's events / notes / user_context, and proactively
  surfaces patterns the agent should react to — overdue commitments,
  long silences, accumulating capture shelves. Detected patterns land
  as `eidan.escalations` rows the UI inbox surfaces; complex patterns
  also queue a Claude-side analysis job. Phase 1 ships deterministic
  detectors; the Phi-3 / Ollama local-inference path lands once a
  local-model adapter exists.

tier: core
license: AGPL
authors:
  - name: Eidan Core
    email: core@eidan.dev

host:
  eidan: ">=0.1.0"
  python: ">=3.11"

env:
  - name: EIDAN_SENTRY_ENABLED
    required: false
    default: "1 on Pi/k8s/Heroku/local; 0 on Fly"
    description: >
      Set to "1" to enable the sentry tick, "0" to disable. When
      unset the default is node-type-aware: Fly machines default
      OFF (the tick is intended to call a model — see
      EIDAN_SENTRY_MODEL — and the operator should opt in
      explicitly on Fly to avoid silent LLM cost on every node);
      every other node type (Pi, k8s, Heroku, local) defaults ON.
      Operators pin explicitly via env to override either default.
  - name: EIDAN_SENTRY_TICK_INTERVAL
    required: false
    default: "PT5M"
    description: >
      ISO-8601 duration between sentry ticks. The schedule trigger
      reads this verbatim, so changing it changes the cadence at
      activation time (no in-flight rescheduling).
  - name: EIDAN_SENTRY_MODEL
    required: false
    default: "phi3"
    description: >
      Model name the sentry loop asks the host's provider for when
      its open-ended pattern matcher runs. Pinned per-node so a
      cheap local model (e.g. phi3 via Ollama) can drive sentry
      independently of whatever the foreground agent uses. Phase 1
      detectors are deterministic and do not call the model; this
      slot is read by the Phi-3 / Ollama path that lands with the
      local-model adapter (see plugin.py + patterns.py).

backend:
  entrypoint: eidan_sentry.plugin:Plugin

migrations:
  dir: ./migrations
  driver: alembic

behaviours:
  - id: sentry:tick
    trigger: schedule:PT5M
    handler: eidan_sentry.plugin:Plugin

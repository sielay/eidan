schema: 1

name: example-core
version: 0.1.0
display_name: Example Core
description: >
  Phase 4 acceptance plugin: exercises the manifest validator and the
  PluginBase / PluginContext shape without contributing any real
  product surface. The Plugin class is constructable, on_activate
  runs against a real PluginContext, and the only extension point
  declared is a single core-tier behaviour.

tier: core
license: AGPL
authors:
  - name: Eidan Core
    email: core@eidan.dev

host:
  eidan: ">=0.1.0"
  python: ">=3.11"

backend:
  entrypoint: example_core.plugin:Plugin

migrations:
  dir: ./migrations
  driver: alembic

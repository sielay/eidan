schema: 1

name: capture
version: 0.1.0
display_name: Capture
description: >
  Write-side companion to `learn`. Registers three tools the agent
  uses to capture information into eidan's memory tables: `remember`
  (curated skill-tagged notes → `eidan.knowledge`), `note` (working
  memory → `eidan.notes`), and `event` (calendar-like items →
  `eidan.events`). Identity is read ambient-style from the loop's
  contextvar, so each capture lands on the right user without the
  tool surface having to carry it.

tier: core
license: AGPL
authors:
  - name: Eidan Core
    email: core@eidan.dev

host:
  eidan: ">=0.1.0"
  python: ">=3.11"

backend:
  entrypoint: eidan_capture.plugin:Plugin

[project]
name = "eidan-capture"
version = "0.1.0"
description = "Eidan core plugin: write-side tools (remember, note, event) for the agent loop"
requires-python = ">=3.11"
dependencies = [
    "eidan-backend",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidan_capture"]

schema: 1

name: example-behaviour
version: 0.1.0
display_name: Example Behaviour
description: >
  Phase 1.5 test plugin: registers a single cron-triggered behaviour
  the handler that the behaviour-loader smoke tests exercise. There is
  no real product surface here — the plugin exists so the host's
  behaviour dispatch path has something to fire against until real
  bundles land.

tier: core
license: AGPL
authors:
  - name: Eidan Core
    email: core@eidan.dev

host:
  eidan: ">=0.1.0"
  python: ">=3.11"

# No env / vault / migrations / routes — this plugin contributes only
# a behaviour. `001 §1.2` permits omitting unused extension points.

backend:
  entrypoint: example_behaviour.plugin:Plugin

behaviours:
  - id: example-behaviour:tick
    trigger: "cron:* * * * *"
    handler: example_behaviour.behaviours:tick

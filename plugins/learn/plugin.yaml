schema: 1

name: learn
version: 0.1.0
display_name: Learn
description: >
  Knowledge acquisition orchestrator. Registers a `learn` tool the
  primary call invokes when the user wants to research a topic — it
  surveys what the operator already knows (`eidan.knowledge`,
  `eidan.notes`, recent `eidan.messages`), names the gaps, and
  suggests clarifying questions. The model uses the tool's output
  to compose a user-facing plan. Phase 1 ships the DB-survey
  surface only; MCP / external connectors (web search, Obsidian,
  Notion) are Phase 2 (issue #50).

tier: core
license: AGPL
authors:
  - name: Eidan Core
    email: core@eidan.dev

host:
  eidan: ">=0.1.0"
  python: ">=3.11"

backend:
  entrypoint: eidan_learn.plugin:Plugin

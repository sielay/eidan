[project]
name = "eidan-learn"
version = "0.1.0"
description = "Eidan core plugin: `/learn` — survey existing memory for what the operator already knows about a topic"
requires-python = ">=3.11"
dependencies = [
    "eidan-backend",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidan_learn"]
